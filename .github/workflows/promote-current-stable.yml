name: Promote DBM-CoA v5.2.13 to current stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-current-stable.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and promote existing v5.2.13 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="uncle-bone/DBM-CoA"
          TAG="v5.2.13"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "DBM-CoA-v5.2.13.zip" and .size > 0 and .state == "uploaded") | .name' | grep -qx 'DBM-CoA-v5.2.13.zip'
          gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.prerelease == false and .draft == false' | grep -qx true
          test "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG"
