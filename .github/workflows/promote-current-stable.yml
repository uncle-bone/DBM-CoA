name: Promote DBM-CoA v5.2.19 to current stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-current-stable.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify release ZIP and mark v5.2.19 stable and latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v5.2.19 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="DBM-CoA-v5.2.19.zip" and .size>0) | .name' | grep -Fx 'DBM-CoA-v5.2.19.zip'
          gh release edit v5.2.19 --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          gh release view v5.2.19 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -Fx false
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | grep -Fx v5.2.19
