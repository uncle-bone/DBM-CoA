name: Build and publish versioned addon
on:
  push:
    branches: [main]
    paths: ['.release.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: addon-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WoW 3.3.5a Lua 5.1 syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find DBM-CoA-Learner DBM-Party-Vanilla -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/coasync_channel_test.lua
          lua5.1 tests/smartsync3_identity_test.lua
          python3 - <<'PY'
          from pathlib import Path
          toc=(Path('DBM-CoA-Learner')/'DBM-CoA-Learner.toc').read_text()
          options=(Path('DBM-CoA-Learner')/'Options.lua').read_text()
          smart=(Path('DBM-CoA-Learner')/'SmartSync3.lua').read_text()
          assert '## Version: 6.0.0-test1' in toc
          assert 'GetAddOnMetadata("DBM-CoA-Learner","Version")' in options
          assert 'GetAddOnMetadata("DBM-CoA-Learner","Version")' in smart
          PY
      - name: Verify CoASync migration and safe channel ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          names=['Learner.lua','SmartSync3.lua','ArchiveShare.lua','Options.lua','SyncThrottle.lua']
          for name in names:
              data=(Path('DBM-CoA-Learner')/name).read_text()
              assert 'BBLC25C' not in data, f'Legacy channel remains in {name}'
          for name in ['Learner.lua','SmartSync3.lua','ArchiveShare.lua']:
              data=(Path('DBM-CoA-Learner')/name).read_text()
              assert 'CoASync' in data, f'CoASync missing from {name}'
          learner=(Path('DBM-CoA-Learner')/'Learner.lua').read_text()
          assert 'SLASH_DBMCOA1="/dbmcoa"' in learner
          assert 'ChatFrame_RemoveChannel(' not in learner
          assert 'LeaveChannelByName(' not in learner
          for name in ['Learner.lua','SmartSync3.lua','ArchiveShare.lua']:
              data=(Path('DBM-CoA-Learner')/name).read_text()
              assert 'if isSelfSender(sender) then return end' in data, f'Self-sync filter missing from {name}'
          print('CoASync migration, self-sync filtering, and Learner command invariants verified')
          PY
      - name: Restore exact offline research database
        run: |
          python3 - <<'PYCODE'
          import gzip,pathlib,hashlib
          p=pathlib.Path('CoA-Research-Offline/reference_index_v339.sqlite.gz')
          data=gzip.decompress(p.read_bytes())
          assert hashlib.sha256(data).hexdigest() == 'fd0cb41c93e57b8f73c03eba1eddfce63458c419855c224eaac449dab800d0b0'
          p.with_suffix('').write_bytes(data)
          p.unlink()
          PYCODE
      - name: Validate manifest and package installable folders
        run: |
          python3 - <<'PY'
          import pathlib,json,zipfile,re,os
          root=pathlib.Path('.')
          cfg=json.loads((root/'.release.json').read_text())
          assert re.fullmatch(r'v[0-9]+(?:[.][0-9]+)+(?:-CoA|-test[0-9]+)?',cfg['version'])
          folders=cfg['folders']
          assert folders and len(folders)==len(set(folders))
          for name in folders:
              assert '/' not in name and '\\' not in name and name not in ('.','..')
              p=root/name
              assert p.is_dir() and list(p.glob('*.toc')), 'Missing addon or TOC: '+name
          out=root/'dist';out.mkdir(exist_ok=True)
          artifact=out/(os.environ['GITHUB_REPOSITORY'].split('/')[-1]+'-'+cfg['version']+'.zip')
          with zipfile.ZipFile(artifact,'w',zipfile.ZIP_DEFLATED) as z:
              for name in folders + cfg.get('extras', []):
                  for p in sorted((root/name).rglob('*')):
                      if p.is_file() and p.name not in ('.DS_Store','Thumbs.db'):
                          z.write(p,p.as_posix())
          with zipfile.ZipFile(artifact) as z: assert z.testzip() is None
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('VERSION='+cfg['version']+'\n')
              f.write('ASSET='+str(artifact)+'\n')
              f.write('PRERELEASE='+str(cfg['prerelease']).lower()+'\n')
          PY
      - name: Publish release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber
            gh release edit "$VERSION" --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes-file RELEASE-NOTES.md --prerelease="$PRERELEASE"
          else
            gh release create "$VERSION" "$ASSET" --target "$GITHUB_SHA" --title "${GITHUB_REPOSITORY#*/} $VERSION" --notes-file RELEASE-NOTES.md "${args[@]}"
          fi

